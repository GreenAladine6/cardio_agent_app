services:
  api-gateway:
    build:
      context: ./api_getway
      dockerfile: Dockerfile
    image: cardio-api-gateway:latest
    container_name: cardio-api-gateway
    ports:
      - "8000:8000"
    environment:
      AUDIO_ENGINE_URL: http://audio-engine:8000
    depends_on:
      - audio-engine
    restart: unless-stopped

  audio-engine:
    build:
      context: ./audio_engine
      dockerfile: Dockerfile
    image: cardio-audio-engine:latest
    container_name: cardio-audio-engine
    ports:
      - "8001:8000"
    environment:
      ONNX_MODEL_PATH: /models/pcg_classifier.onnx
      MLFLOW_TRACKING_URI: file:/mlruns
      MAX_AUDIO_BYTES: 20971520
    volumes:
      - ./models:/models
      - ./mlruns:/mlruns
    restart: unless-stopped
