services:
  mlflow:
    build:
      context: ./mlflow_service
      dockerfile: Dockerfile
    image: cardio-mlflow:latest
    container_name: cardio-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow/data
      - mlflow-artifacts:/mlflow/artifacts
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api_getway
      dockerfile: Dockerfile
    image: cardio-api-gateway:latest
    container_name: cardio-api-gateway
    ports:
      - "8000:8000"
    environment:
      AUDIO_ENGINE_URL: http://audio-engine:8000
      AUDIO_ENGINE_INFER_PATH: /v1/infer
    restart: unless-stopped

  llm-inference:
    build:
      context: .
      dockerfile: llm_finetuning/Dockerfile
    image: cardio-llm-inference:latest
    container_name: cardio-llm-inference
    ports:
      - "8002:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL_NAME: cardio-llm
      OLLAMA_REQUEST_TIMEOUT_SECONDS: "120"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: cardio-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
      - ./models/gguf:/models:ro
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  audio-engine:
    build:
      context: .
      dockerfile: audio_engine/Dockerfile
    image: cardio-audio-engine:latest
    container_name: cardio-audio-engine
    ports:
      - "8001:8000"
    environment:
      ONNX_MODEL_PATH: /models/pcg_classifier.onnx
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./models:/models
    depends_on:
      mlflow:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mlflow-data:
  mlflow-artifacts:
  ollama-data:
