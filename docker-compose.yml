services:
  mlflow:
    build:
      context: ./mlflow_service
      dockerfile: Dockerfile
    image: cardio-mlflow:latest
    container_name: cardio-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow/data
      - mlflow-artifacts:/mlflow/artifacts
    restart: unless-stopped

  agent-orchestrator:
    build:
      context: .
      dockerfile: agent-orchestrator/Dockerfile
    image: cardio-agent-orchestrator:latest
    container_name: cardio-agent-orchestrator
    ports:
      - "8003:8000"
    environment:
      LLM_SERVER_URL: http://llm-inference:8000/v1/chat
      QDRANT_URL: http://vector-db:6333
      QDRANT_COLLECTION_NAME: clinical_guidelines
      LLM_TIMEOUT_SECONDS: "120"
      HF_HOME: /cache/huggingface
    volumes:
      - embedding-cache:/cache/huggingface
    depends_on:
      llm-inference:
        condition: service_started
      qdrant:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api_getway
      dockerfile: Dockerfile
    image: cardio-api-gateway:latest
    container_name: cardio-api-gateway
    ports:
      - "8000:8000"
    environment:
      AUDIO_ENGINE_URL: http://audio-engine:8000
      AUDIO_ENGINE_INFER_PATH: /v1/infer
      ORCHESTRATOR_URL: http://agent-orchestrator:8000
    depends_on:
      agent-orchestrator:
        condition: service_started
      audio-engine:
        condition: service_started
    restart: unless-stopped

  llm-inference:
    build:
      context: .
      dockerfile: llm_finetuning/Dockerfile
    image: cardio-llm-inference:latest
    container_name: cardio-llm-inference
    networks:
      default:
        aliases:
          - llm-inference-api
    ports:
      - "8002:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL_NAME: cardio-llm
      OLLAMA_REQUEST_TIMEOUT_SECONDS: "120"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: cardio-ollama
    networks:
      default:
        aliases:
          - llm-server
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
      - ./models/gguf:/models:ro
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  audio-engine:
    build:
      context: .
      dockerfile: audio_engine/Dockerfile
    image: cardio-audio-engine:latest
    container_name: cardio-audio-engine
    ports:
      - "8001:8000"
    environment:
      ONNX_MODEL_PATH: /models/pcg_classifier.onnx
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./models:/models
    depends_on:
      mlflow:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    # The Compose service is named `qdrant`; clients should use Docker DNS.
    networks:
      default:
        aliases:
          - vector-db
    image: qdrant/qdrant:latest
    container_name: cardio-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  mlflow-data:
  mlflow-artifacts:
  ollama-data:
  qdrant-data:
  embedding-cache:

networks:
  default:
    name: cardioagent-ops
