services:
  mlflow:
    build:
      context: ./mlflow_service
      dockerfile: Dockerfile
    image: cardio-mlflow:latest
    container_name: cardio-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow/data
      - mlflow-artifacts:/mlflow/artifacts
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api_getway
      dockerfile: Dockerfile
    image: cardio-api-gateway:latest
    container_name: cardio-api-gateway
    ports:
      - "8000:8000"
    environment:
      AUDIO_ENGINE_URL: http://audio-engine:8000
      AUDIO_ENGINE_INFER_PATH: /v1/infer
    restart: unless-stopped

  audio-engine:
    build:
      context: ./audio_engine
      dockerfile: Dockerfile
    image: cardio-audio-engine:latest
    container_name: cardio-audio-engine
    ports:
      - "8001:8000"
    environment:
      ONNX_MODEL_PATH: /models/pcg_classifier.onnx
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./models:/models
    depends_on:
      mlflow:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mlflow-data:
  mlflow-artifacts:
