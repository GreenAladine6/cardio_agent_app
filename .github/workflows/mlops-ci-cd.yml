name: MLOps CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-compose:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.13.2
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            audio_engine/pyproject.toml
            api_getway/app/requirements.txt
            llm_finetuning/requirements-inference.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "audio_engine[dev]"
          python -m pip install -r api_getway/app/requirements.txt
          python -m pip install -r llm_finetuning/requirements-inference.txt
          python -m pip install "qdrant-client>=1.13,<2"
          python -m pip install "langgraph>=0.2,<1"
      - name: Wait for Qdrant
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:6333/healthz; then exit 0; fi
            sleep 2
          done
          echo "Qdrant did not become healthy" >&2
          exit 1
      - name: Run tests with coverage
        run: python -m pytest -m "unit or integration" --junitxml=junit.xml
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build service images
        run: docker compose build
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: ignore
