name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit and API integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            audio_engine/pyproject.toml
            api_getway/app/requirements.txt
            llm_finetuning/requirements-inference.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "audio_engine[dev]"
          python -m pip install -r api_getway/app/requirements.txt
          python -m pip install -r llm_finetuning/requirements-inference.txt

      - name: Run unit and API integration tests with coverage
        run: python -m pytest -m "unit or integration" --junitxml=junit.xml

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: ignore

  llm-conformance:
    name: LLM conformance tests
    if: ${{ vars.LLM_CONFORMANCE_ENABLED == 'true' }}
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            audio_engine/pyproject.toml
            api_getway/app/requirements.txt
            llm_finetuning/requirements-inference.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "audio_engine[dev]"
          python -m pip install -r api_getway/app/requirements.txt
          python -m pip install -r llm_finetuning/requirements-inference.txt

      - name: Run LLM conformance tests
        run: python -m pytest -m llm_conformance
