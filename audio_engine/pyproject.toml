[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardio-audio-engine"
version = "0.1.0"
description = "PCG preprocessing, MLflow benchmarking, and ONNX inference service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "librosa>=0.10,<1",
    "mlflow>=2.18,<4",
    "numpy>=1.26,<3",
    "onnx>=1.17,<2",
    "onnxruntime>=1.20,<2",
    "python-multipart>=0.0.20,<1",
    "scikit-learn>=1.5,<2",
    "skl2onnx>=1.17,<2",
    "uvicorn[standard]>=0.34,<1",
]

[tool.setuptools.packages.find]
where = ["."]
