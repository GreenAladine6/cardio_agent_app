[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardio-audio-engine"
version = "0.1.0"
description = "PCG preprocessing, MLflow benchmarking, and ONNX inference service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<0.116",
    "pydantic>=2.10,<3",
    "librosa>=0.10,<1",
    "mlflow-skinny>=2.18,<4",
    "numpy>=1.26,<2",
    "PyYAML>=6,<7",
    "scipy>=1.14,<2",
    "soundfile>=0.13,<1",
    "onnx>=1.17,<2",
    "onnxruntime>=1.20,<2",
    "python-multipart>=0.0.20,<1",
    "scikit-learn>=1.5,<2",
    "skl2onnx>=1.17,<2",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
training = [
    "pandas>=2.2,<3",
    "torch==2.3.1",
    "torchvision==0.18.1",
]
dev = [
    "pandas>=2.2,<3",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["."]
