[pytest]
testpaths = tests
addopts =
    --strict-markers
    --cov=audio_engine
    --cov=api_getway.app.main
    --cov=llm_finetuning
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
markers =
    unit: isolated unit tests
    integration: service and API integration tests
    llm_conformance: LLM-specific conformance tests (enable only when an LLM integration exists)
